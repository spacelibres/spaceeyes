name: Core Foundation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            web/package-lock.json
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set 1.96.0
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --prefix platform --ignore-scripts
      - run: npm ci --prefix web --ignore-scripts
      - name: Deployment security and cache tests
        run: |
          node --test deploy/tests/*.test.mjs
          python3 -m unittest discover -s deploy/tests -p test_archive.py
          bash deploy/tests/test_deploy_release.sh
      - name: Core and real WASM integration
        shell: pwsh
        run: ./tools/check-core.ps1 -Renderer -ReleaseWasm -Workspace
      - name: Package and verify Linux standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'spacelibres/spaceeyes'
        shell: bash
        run: |
          set -euo pipefail
          root=web/.next/standalone
          test -f "$root/web/server.js"
          rm -rf -- "$root/web/.cache" "$root/web/.next/cache"
          cp -a web/public "$root/web/public"
          cp -a web/.next/static "$root/web/.next/static"
          (cd "$root/web" && node -e "const r=require.resolve('@loaders.gl/textures'),p=require('path'),f=require('fs');if(!r.includes('/standalone/'))throw Error('codec outside standalone');for(const n of ['basis_encoder.js','basis_encoder.wasm'])f.accessSync(p.join(p.dirname(r),'libs',n))")
          tar -czhf "$RUNNER_TEMP/spaceeyes-release.tar.gz" -C "$root" .
          python3 deploy/validate_archive.py "$RUNNER_TEMP/spaceeyes-release.tar.gz"
          (cd "$root/web" && HOSTNAME=127.0.0.1 PORT=4310 node server.js > "$RUNNER_TEMP/spaceeyes-smoke.log" 2>&1) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4310/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:4310/wasm/spaceeyes_core_bg.wasm -o /dev/null
      - name: Deploy verified main release through signed webhook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'spacelibres/spaceeyes'
        env:
          SPACEEYES_DEPLOY_SECRET: ${{ secrets.SPACEEYES_DEPLOY_SECRET }}
        run: node deploy/send.mjs "$RUNNER_TEMP/spaceeyes-release.tar.gz" "$GITHUB_SHA"
