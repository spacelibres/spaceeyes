[package]
name = "spaceeyes-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
spaceeyes-engine = { path = "../../crates/engine" }
spaceeyes-time = { path = "../../crates/time" }
spaceeyes-protocol-adapter = { path = "../../crates/protocol-adapter" }
wasm-bindgen = "0.2"

[features]
default = []
browser = ["spaceeyes-protocol-adapter/gpu", "dep:spaceeyes-rendering", "dep:web-sys", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook"]
[dependencies.spaceeyes-rendering]
path = "../../crates/rendering"
features = ["gpu"]
optional = true
[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]
optional = true
[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.console_error_panic_hook]
version = "0.1.7"
optional = true
