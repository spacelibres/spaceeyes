[package]
name = "spaceeyes-rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
spaceeyes-geometry = { path = "../geometry" }
spaceeyes-spatial = { path = "../spatial" }
spaceeyes-resources = { path = "../resources" }
spaceeyes-snapshot = { path = "../snapshot" }
spaceeyes-foundation = { path = "../foundation" }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:web-sys", "dep:futures-channel"]

[dependencies.wgpu]
version = "30.0.1"
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dev-dependencies]
spaceeyes-scene = { path = "../scene" }
spaceeyes-time = { path = "../time" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }
futures-channel = { version = "0.3", optional = true }
