[package]
name = "spaceeyes-protocol-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
spaceeyes-rendering = { path = "../rendering" }
spaceeyes-spatial = { path = "../spatial" }
spaceeyes-resources = { path = "../resources" }
spaceeyes-geometry = { path = "../geometry" }
spaceeyes-engine = { path = "../engine" }
spaceeyes-scene = { path = "../scene" }
spaceeyes-foundation = { path = "../foundation" }
spaceeyes-time = { path = "../time" }
spaceeyes-astro = { path = "../astro" }
prost = "0.13"
sha2 = "=0.11.0"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
protoc-bin-vendored = "3"

[features]
default = []
gpu = ["spaceeyes-engine/gpu", "spaceeyes-rendering/gpu"]
