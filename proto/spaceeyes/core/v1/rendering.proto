syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/spatial.proto";
import "spaceeyes/core/v1/common.proto";
message PerspectiveProjection { double vertical_fov_radians=1; double near_m=2; double far_m=3; }
message OrthographicProjection { double half_height_m=1; double near_m=2; double far_m=3; }
message Projection { oneof kind { PerspectiveProjection perspective=1; OrthographicProjection orthographic=2; } }
// The owning SceneObject supplies the camera identity and FrameId.
message CameraState { Vector3d position_m=4; Quaterniond orientation=5; Projection projection=6; CameraTracking tracking=7; }
// Target-reference-relative +Z offset; derived each frame, not integrated by the host.
message CameraTracking { ObjectId target=1; double distance_m=2; }
message ColorRgb { float r=1; float g=2; float b=3; }
// Solid-colour local-frame polyline; not pickable and not textured.
message LinePrimitive { repeated Vector3d points_m=1; ColorRgb color=2; }
message SpherePrimitive { double radius_m=1; ColorRgb base_color=2; optional Material material=3; }
message MeshVertex { Vector3d position_m=1; Vector3d normal=2; optional Vector2f uv=3; }
message TriangleMesh { repeated MeshVertex vertices=1; repeated uint32 indices=2; }
message MeshInstance { spaceeyes.core.v1.ResourceId geometry=1; ColorRgb base_color=2; optional Material material=3; }

message Vector2f { float x=1; float y=2; }
enum SamplingFilter { SAMPLING_FILTER_UNSPECIFIED=0; SAMPLING_FILTER_NEAREST=1; SAMPLING_FILTER_LINEAR=2; }
enum SamplingAddress { SAMPLING_ADDRESS_UNSPECIFIED=0; SAMPLING_ADDRESS_CLAMP=1; SAMPLING_ADDRESS_REPEAT=2; }
message Material { ColorRgb base_color=1; optional ResourceId texture=2; SamplingFilter filter=3; SamplingAddress address=4; bool unlit=5; }
enum TextureColorSpace { TEXTURE_COLOR_SPACE_UNSPECIFIED=0; TEXTURE_COLOR_SPACE_LINEAR=1; TEXTURE_COLOR_SPACE_SRGB=2; }
message TextureData { uint32 width=1; uint32 height=2; bytes rgba8=3; TextureColorSpace color_space=4; }
