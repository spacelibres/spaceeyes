syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/common.proto";

enum TimeScale {
  TIME_SCALE_UNSPECIFIED = 0;
  TT = 1;
  TDB = 2;
  UTC = 3;
  TAI = 4;
}
message TimeInstant {
  TimeScale time_scale = 1;
  string epoch_id = 2;
  sint64 seconds = 3;
  uint32 nanos = 4;
}
// Strict proleptic Gregorian UTC fields; second 60 is only valid on a leap day.
message UtcDateTime {
  int32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
  uint32 hour = 4;
  uint32 minute = 5;
  uint32 second = 6;
  uint32 nanos = 7;
}
// Read-only conversion; input is either a UTC calendar value or an explicit
// TAI/TT/TDB instant. UTC as a bare TimeInstant is rejected because UTC needs
// the leap-second calendar context.
message TimeConversionQuery {
  oneof input {
    UtcDateTime utc = 1;
    TimeInstant instant = 2;
  }
}
message TimeConversion {
  UtcDateTime utc = 1;
  TimeInstant tdb = 2;
  TimeInstant tt = 3;
  TimeInstant tai = 4;
  sint64 tt_minus_utc_nanos = 5;
  bool predicted = 6;
}
message TimeRange {
  TimeInstant start = 1;
  TimeInstant end = 2;
  bool include_start = 3;
  bool include_end = 4;
}
enum PlaybackMode {
  PLAYBACK_MODE_UNSPECIFIED = 0;
  PAUSED = 1;
  PLAYING = 2;
  LIVE = 3;
}
message ClockState {
  TimeInstant instant = 1;
  PlaybackMode mode = 2;
  double rate = 3;
  uint64 generation = 4;
  uint64 revision = 5;
  sint32 rate_numerator = 6;
  uint32 rate_denominator = 7;
}
message PlayCommand {}
message PauseCommand {}
message SeekCommand { TimeInstant instant = 1; }
message SetRateCommand { double rate = 1; }
message LiveCommand {}
message StepCommand { sint64 delta_nanos = 1; }
message TimeCommand {
  oneof action {
    PlayCommand play = 1;
    PauseCommand pause = 2;
    SeekCommand seek = 3;
    SetRateCommand set_rate = 4;
    LiveCommand live = 5;
    StepCommand step = 6;
  }
}
