syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/common.proto";
import "spaceeyes/core/v1/rendering.proto";
message RegisterMeshResource { ResourceId resource_id=1; TriangleMesh mesh=2; }
message RegisterTextureResource { ResourceId resource_id=1; TextureData texture=2; }
message ResourceCommand { oneof action { RegisterMeshResource register_mesh=1; RegisterTextureResource register_texture=2; } }
message ResourceResponse { ResourceId resource_id=1; uint64 resource_revision=2; }
// Logical reservations, not RSS/VRAM measurements; all byte values use uint64.
message ResourceStats { uint64 total_used_bytes=1; uint64 cpu_used_bytes=2; uint64 gpu_used_bytes=3; uint64 staging_used_bytes=4; uint64 total_limit_bytes=5; uint64 cpu_limit_bytes=6; uint64 gpu_limit_bytes=7; uint64 staging_limit_bytes=8; uint64 resource_revision=9; }
message ResourceStatsQuery {}
