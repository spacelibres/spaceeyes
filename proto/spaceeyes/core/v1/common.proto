syntax = "proto3";
package spaceeyes.core.v1;

// Schema namespace v1 is independent of project release 0.0.1.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  string schema_id = 3;
}
message ObjectId { string value = 1; }
message FrameId { string value = 1; }
message ResourceId { string value = 1; }
message RequestContext {
  string request_id = 1;
  string session_id = 2;
  ProtocolVersion protocol_version = 3;
  optional string correlation_id = 4;
  optional string causation_id = 5;
  optional uint64 expected_scene_revision = 6;
  optional uint64 time_generation = 7;
}
enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  UNSUPPORTED_VERSION = 2;
  UNKNOWN_OBJECT = 3;
  UNKNOWN_FRAME = 4;
  STALE_GENERATION = 5;
  REVISION_CONFLICT = 6;
  INVALID_HANDLE = 7;
  RESOURCE_EXCEEDED = 8;
  PERMISSION_DENIED = 9;
  PROVIDER_UNAVAILABLE = 10;
  CANCELLED = 11;
  INTERNAL_ERROR = 12;
  IDEMPOTENCY_CONFLICT = 13;
  SNAPSHOT_EXPIRED = 14;
}
message ErrorDetail { string key = 1; string value = 2; }
message Error {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  repeated ErrorDetail details = 4;
}
