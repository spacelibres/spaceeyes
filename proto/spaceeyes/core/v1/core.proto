syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/common.proto";
import "spaceeyes/core/v1/time.proto";
import "spaceeyes/core/v1/scene.proto";
import "spaceeyes/core/v1/resources.proto";
import "spaceeyes/core/v1/spatial.proto";
message CommandEnvelope { reserved 20, 21; RequestContext context=1; oneof payload { SceneCommand scene=2; TimeCommand time=3; ResourceCommand resource=4; SceneTransaction scene_transaction=7; SpatialCommand spatial=8; LifecycleCommand lifecycle=9; } }
enum ResponseStatus { RESPONSE_STATUS_UNSPECIFIED=0; RESPONSE_STATUS_ACCEPTED=1; RESPONSE_STATUS_COMPLETED=2; RESPONSE_STATUS_REJECTED=3; RESPONSE_STATUS_CANCELLED=4; RESPONSE_STATUS_FAILED=5; }
message TimeResponse { ClockState clock=1; }
message SceneResponse { uint64 revision=1; }
message ResponseEnvelope { string request_id=1; ResponseStatus status=2; oneof payload { SceneResponse scene=3; TimeResponse time=4; ResourceResponse resource=5; Error error=6; SpatialResponse spatial=10; SessionStatus session=11; FrameResolution frame=12; } uint64 command_sequence=7; uint64 committed_scene_revision=8; uint64 frame_sequence=9; }

message StartEngine {}
message StopEngine {}
message LifecycleCommand { oneof action { StartEngine start=1; StopEngine stop=2; } }
enum EngineLifecycle { ENGINE_LIFECYCLE_UNSPECIFIED=0; ENGINE_LIFECYCLE_READY=1; ENGINE_LIFECYCLE_RUNNING=2; ENGINE_LIFECYCLE_STOPPED=3; }
message SessionStatus { EngineLifecycle lifecycle=1; ClockState clock=2; uint64 scene_revision=3; uint64 frame_graph_revision=4; uint64 resource_revision=5; uint64 frame_sequence=6; uint64 object_count=7; uint64 resource_used_bytes=8; }
message SessionStatusQuery {}
// Read-only: IDs do not participate in command idempotency history.
message QueryEnvelope { reserved 2 to 9; RequestContext context=1; oneof payload { SessionStatusQuery session_status=20; ResolveFrameQuery resolve_frame=21; } }
