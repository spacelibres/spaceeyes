syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/common.proto";
import "spaceeyes/core/v1/time.proto";
import "spaceeyes/core/v1/scene.proto";
import "spaceeyes/core/v1/resources.proto";
import "spaceeyes/core/v1/spatial.proto";
import "spaceeyes/core/v1/rendering.proto";
import "spaceeyes/core/v1/dynamo.proto";
import "spaceeyes/core/v1/project.proto";
message CommandEnvelope { reserved 20, 21, 22, 30; RequestContext context=1; oneof payload { SceneCommand scene=2; TimeCommand time=3; ResourceCommand resource=4; SceneTransaction scene_transaction=7; SpatialCommand spatial=8; LifecycleCommand lifecycle=9; CameraCommand camera=10; } }
enum ResponseStatus { RESPONSE_STATUS_UNSPECIFIED=0; RESPONSE_STATUS_ACCEPTED=1; RESPONSE_STATUS_COMPLETED=2; RESPONSE_STATUS_REJECTED=3; RESPONSE_STATUS_CANCELLED=4; RESPONSE_STATUS_FAILED=5; }
message TimeResponse { ClockState clock=1; }
message SceneResponse { uint64 revision=1; }
message ResponseEnvelope { string request_id=1; ResponseStatus status=2; oneof payload { SceneResponse scene=3; TimeResponse time=4; ResourceResponse resource=5; Error error=6; SpatialResponse spatial=10; SessionStatus session=11; FrameResolution frame=12; Capabilities capabilities=13; FramePresented presented=14; PresentedSelection selection=15; CameraInfo camera=16; ResourceStats resource_stats=17; ResourceUploadStatus upload=18; ProjectSnapshot project=19; ObjectPage objects=20; EventPage events=21; FrameCoverage frame_coverage=22; TimeConversion time_conversion=23; DynamoState dynamo=24; } uint64 command_sequence=7; uint64 committed_scene_revision=8; uint64 frame_sequence=9; }

message StartEngine {}
message StopEngine {}
message LifecycleCommand { oneof action { StartEngine start=1; StopEngine stop=2; } }
enum EngineLifecycle { ENGINE_LIFECYCLE_UNSPECIFIED=0; ENGINE_LIFECYCLE_READY=1; ENGINE_LIFECYCLE_RUNNING=2; ENGINE_LIFECYCLE_STOPPED=3; ENGINE_LIFECYCLE_CREATED=4; ENGINE_LIFECYCLE_INITIALIZING=5; ENGINE_LIFECYCLE_STOPPING=6; ENGINE_LIFECYCLE_FAILED=7; }
message SessionStatus { EngineLifecycle lifecycle=1; ClockState clock=2; uint64 scene_revision=3; uint64 frame_graph_revision=4; uint64 resource_revision=5; uint64 frame_sequence=6; uint64 object_count=7; uint64 resource_used_bytes=8; string session_id=9; }
message SessionStatusQuery {}
// Declared provider interval; covered=false means no published range.
message FrameCoverageQuery { FrameId frame=1; }
message FrameCoverage { FrameId frame=1; bool covered=2; optional TimeInstant start=3; optional TimeInstant end=4; string provider_id=5; string provider_version=6; }
// Replay buffered events strictly after the cursor; 0 max means the default page.
message EventsQuery { uint64 after_sequence=1; uint32 max_events=2; }
message EventPage { repeated CoreEvent events=1; uint64 next_sequence=2; uint64 replay_from=3; }
enum CoreEventKind { CORE_EVENT_KIND_UNSPECIFIED=0; SCENE_CHANGED=1; CLOCK_CHANGED=2; FRAME_INVALIDATED=3; TASK_STATUS_CHANGED=4; RESOURCE_STATE_CHANGED=5; FRAME_PUBLISHED=6; }
message CoreEvent { uint64 sequence=1; string session_id=2; CoreEventKind kind=3; uint64 command_sequence=4; string request_id=5; uint64 scene_revision=6; uint64 frame_graph_revision=7; uint64 resource_revision=8; uint64 frame_sequence=9; uint64 time_generation=10; }
// Stable ObjectId ordering; the opaque token is the last returned id.
message ListObjectsQuery { optional string page_token=1; uint32 page_size=2; }
message ObjectPage { repeated SceneObject objects=1; string next_page_token=2; uint64 scene_revision=3; }
// Read-only: IDs do not participate in command idempotency history.
message QueryEnvelope { reserved 2 to 9, 30; RequestContext context=1; oneof payload { SessionStatusQuery session_status=20; ResolveFrameQuery resolve_frame=21; CapabilitiesQuery capabilities=22; PickPresentedQuery pick_presented=23; CameraStateQuery camera_state=24; ResourceStatsQuery resource_stats=25; ResourceUploadQuery upload=26; ProjectExportQuery project_export=27; ListObjectsQuery list_objects=28; EventsQuery events=29; FrameCoverageQuery frame_coverage=31; TimeConversionQuery time_conversion=32; EvaluateDynamoQuery evaluate_dynamo=33; } }

message FocusCamera { ObjectId camera=1; ObjectId target=2; double distance_m=3; bool follow=4; }
message CameraCommand { oneof action { FocusCamera focus=1; } }
message CameraStateQuery { ObjectId camera=1; }
message CameraInfo { ObjectId camera=1; FrameId reference=2; CameraState state=3; }

// Exact most recently presented sequence, finite NDC [-1,1]; never a new frame.
message PickPresentedQuery { uint64 frame_sequence=1; float x=2; float y=3; }
// Missing object is a successful miss. Summary belongs to this frame, not a new query.
message PresentedSelection { uint64 frame_sequence=1; uint64 scene_revision=2; SceneObject object=3; }

message CapabilitiesQuery {}
// Support is not authorization or current lifecycle availability.
message Capabilities { ProtocolVersion protocol_version=1; repeated string operations=2; ProtocolLimits limits=3; bool browser_surface=4; }
message ProtocolLimits { uint32 max_message_bytes=1; uint32 max_identifier_bytes=2; uint32 max_scene_commands=3; uint32 max_object_resources=4; uint32 max_texture_dimension=5; uint32 max_mesh_vertices=6; uint32 max_mesh_indices=7; uint64 command_history_capacity=8; uint64 command_history_remaining=9; uint32 max_canvas_dimension=10; uint64 max_frame_elapsed_nanos=11; uint64 max_resource_total_bytes=12; uint64 max_resource_cpu_bytes=13; uint64 max_resource_gpu_bytes=14; uint64 max_resource_staging_bytes=15; uint64 max_upload_bytes=16; uint32 max_upload_chunk_bytes=17; uint32 max_active_uploads=18; uint64 max_encoded_image_bytes=20; }

// Trusted host infrastructure route. Not a plugin command or retryable history entry.
message HostFrameEnvelope { RequestContext context=1; HostFrame frame=30; }
message HostFrame { FrameId reference=1; ObjectId camera=2; uint32 width=3; uint32 height=4; uint64 elapsed_nanos=5; }
message FramePresented { SessionStatus session=1; uint32 width=2; uint32 height=3; uint64 unresolved_objects=4; }
