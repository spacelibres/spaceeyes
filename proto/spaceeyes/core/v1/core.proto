syntax = "proto3";
package spaceeyes.core.v1;
import "spaceeyes/core/v1/common.proto";
import "spaceeyes/core/v1/time.proto";
import "spaceeyes/core/v1/scene.proto";
import "spaceeyes/core/v1/resources.proto";
import "spaceeyes/core/v1/spatial.proto";
message CommandEnvelope { reserved 20, 21, 22, 30; RequestContext context=1; oneof payload { SceneCommand scene=2; TimeCommand time=3; ResourceCommand resource=4; SceneTransaction scene_transaction=7; SpatialCommand spatial=8; LifecycleCommand lifecycle=9; } }
enum ResponseStatus { RESPONSE_STATUS_UNSPECIFIED=0; RESPONSE_STATUS_ACCEPTED=1; RESPONSE_STATUS_COMPLETED=2; RESPONSE_STATUS_REJECTED=3; RESPONSE_STATUS_CANCELLED=4; RESPONSE_STATUS_FAILED=5; }
message TimeResponse { ClockState clock=1; }
message SceneResponse { uint64 revision=1; }
message ResponseEnvelope { string request_id=1; ResponseStatus status=2; oneof payload { SceneResponse scene=3; TimeResponse time=4; ResourceResponse resource=5; Error error=6; SpatialResponse spatial=10; SessionStatus session=11; FrameResolution frame=12; Capabilities capabilities=13; FramePresented presented=14; } uint64 command_sequence=7; uint64 committed_scene_revision=8; uint64 frame_sequence=9; }

message StartEngine {}
message StopEngine {}
message LifecycleCommand { oneof action { StartEngine start=1; StopEngine stop=2; } }
enum EngineLifecycle { ENGINE_LIFECYCLE_UNSPECIFIED=0; ENGINE_LIFECYCLE_READY=1; ENGINE_LIFECYCLE_RUNNING=2; ENGINE_LIFECYCLE_STOPPED=3; }
message SessionStatus { EngineLifecycle lifecycle=1; ClockState clock=2; uint64 scene_revision=3; uint64 frame_graph_revision=4; uint64 resource_revision=5; uint64 frame_sequence=6; uint64 object_count=7; uint64 resource_used_bytes=8; }
message SessionStatusQuery {}
// Read-only: IDs do not participate in command idempotency history.
message QueryEnvelope { reserved 2 to 9, 30; RequestContext context=1; oneof payload { SessionStatusQuery session_status=20; ResolveFrameQuery resolve_frame=21; CapabilitiesQuery capabilities=22; } }

message CapabilitiesQuery {}
// Support is not authorization or current lifecycle availability.
message Capabilities { ProtocolVersion protocol_version=1; repeated string operations=2; ProtocolLimits limits=3; bool browser_surface=4; }
message ProtocolLimits { uint32 max_message_bytes=1; uint32 max_identifier_bytes=2; uint32 max_scene_commands=3; uint32 max_object_resources=4; uint32 max_texture_dimension=5; uint32 max_mesh_vertices=6; uint32 max_mesh_indices=7; uint64 command_history_capacity=8; uint64 command_history_remaining=9; uint32 max_canvas_dimension=10; uint64 max_frame_elapsed_nanos=11; }

// Trusted host infrastructure route. Not a plugin command or retryable history entry.
message HostFrameEnvelope { RequestContext context=1; HostFrame frame=30; }
message HostFrame { FrameId reference=1; ObjectId camera=2; uint32 width=3; uint32 height=4; uint64 elapsed_nanos=5; }
message FramePresented { SessionStatus session=1; uint32 width=2; uint32 height=3; uint64 unresolved_objects=4; }
