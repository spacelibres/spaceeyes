[package]
name = "spaceeyes-core"
version = "0.0.6"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.129"
bevy = { version = "=0.19.1", default-features = false, features = ["std"], optional = true }

[features]
bevy-runtime = ["dep:bevy"]
browser-render = ["bevy-runtime", "bevy/default_app", "bevy/3d_bevy_render", "bevy/bevy_winit", "bevy/scene", "bevy/webgl2", "bevy/x11", "bevy/jpeg", "bevy/webp"]
