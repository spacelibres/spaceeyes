[package]
name = "spaceeyes-core"
version = "0.0.14"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
hifitime = "=4.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.129"
bevy = { version = "=0.19.1", default-features = false, features = ["std"], optional = true }

[features]
bevy-runtime = ["dep:bevy"]
browser-render = ["bevy-runtime", "bevy/default_app", "bevy/common_api", "bevy/bevy_light", "bevy/bevy_mikktspace", "bevy/ktx2", "bevy/morph_animation", "bevy/morph", "bevy/zstd_rust", "bevy/bevy_render", "bevy/bevy_core_pipeline", "bevy/bevy_gizmos_render", "bevy/bevy_anti_alias", "bevy/bevy_gltf", "bevy/bevy_pbr", "bevy/bevy_post_process", "bevy/gltf_animation", "bevy/bevy_winit", "bevy/scene", "bevy/webgl2", "bevy/x11", "bevy/ui_bevy_render", "bevy/jpeg", "bevy/webp"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
